<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Evolución de Humedad - Aula 1.5</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            background-color: #f4f4f9; 
            margin: 0;
            padding: 30px;
        }
        .container { 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            display: inline-block; 
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1); 
            width: 95%;
            max-width: 1200px;
        }
        .instructions {
            margin-bottom: 15px;
            font-size: 14px;
            color: #555;
        }
        .chart-wrapper {
            position: relative;
            width: 100%;
            height: 550px;
        }
        canvas {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="instructions">
            💡 <b>Interactivo:</b> Pasa el cursor para ver coordenadas exactas (X, Y). Usa la rueda del ratón o arrastra para hacer zoom. 
        </div>
        <div class="chart-wrapper">
            <canvas id="tempChart"></canvas>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('tempChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Humedad (%)',
                    data: [],
                    borderColor: 'crimson',
                    backgroundColor: 'rgba(220, 20, 60, 0.1)',
                    borderWidth: 1.5,
                    pointRadius: 0,
                    pointHoverRadius: 5,
                    fill: false,
                    tension: 0.1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    title: {
                        display: true,
                        text: 'Evolución de la humedad en Aula 1.5',
                        font: { size: 16, weight: 'bold' }
                    },
                    legend: { display: false },
                    tooltip: {
                        mode: 'index',
                        intersect: false,
                        callbacks: {
                            label: function(context) {
                                return ' Humedad: ' + context.parsed.y.toFixed(2) + ' %';
                            }
                        }
                    },
                    zoom: {
                        zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode: 'x' },
                        pan: { enabled: true, mode: 'x' }
                    }
                },
                scales: {
                    x: {
                        title: { display: true, text: 'Fecha y Hora', font: { size: 12, weight: 'bold' } },
                        grid: { color: 'rgba(0,0,0,0.05)' }
                    },
                    y: {
                        title: { display: true, text: 'Humedad (%)', font: { size: 12, weight: 'bold' } },
                        grid: { color: 'rgba(200,200,200,0.3)' }
                    }
                }
            }
        });

        // Carga automática de los datos desde el JSON
        fetch('datos.json')
            .then(response => response.json())
            .then(jsonData => {
                chart.data.labels = jsonData.labels;
                chart.data.datasets[0].data = jsonData.data;
                chart.update();
            })
            .catch(error => console.error('Error al cargar los datos:', error));
    </script>
</body>
</html>
