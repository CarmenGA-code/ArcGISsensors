name: Actualizar Gráficos de Sensores

on:
  schedule:
    - cron: '0 6 * * *'  # Se ejecuta todos los días a las 06:00 UTC
  workflow_dispatch:      # Permite ejecutarlo manualmente desde la pestaña "Actions" de GitHub

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install requests pandas

      - name: Ejecutar script de actualización
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python script.py
