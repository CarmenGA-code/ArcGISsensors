name: Actualizar Humedad Automáticamente

on:
  schedule:
    - cron: '0 0 * * 1' # Cada lunes a las 00:00
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  run-python:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: |
          pip install requests pandas

      - name: Ejecutar script de Python
        run: python script.py

      - name: Guardar cambios automáticamente
        run: |
          git config --global user.name "Bot Automático"
          git config --global user.email "bot@users.noreply.github.com"
          git add datos.json
          git commit -m "Actualización automática de datos" || exit 0
          git push
