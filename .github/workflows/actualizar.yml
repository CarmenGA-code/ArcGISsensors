name: Actualizar Gráficos de Sensores

on:
  schedule:
    - cron: '0 6 * * *'  # Todos los días a las 06:00 UTC
  workflow_dispatch:      # Ejecución manual

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install requests pandas

      - name: Ejecutar script de actualización
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          python script.py

      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name "bot-actualizador"
          git config --global user.email "bot@actions.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Actualización automática de datos y gráficos HTML"
          git push origin main
